{% extends 'webuiprojectgreenzabgu/base/base_header.html' %}
{% block content_block_1 %}
    <div class="container" style="max-width: 500px; margin-top: 50px;">
        <h2>Сброс пароля</h2>
        <p>Укажите email, на который зарегистрирован ваш аккаунт. Мы отправим ссылку для сброса пароля.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.email.errors }}
            <input type="email" name="email" class="form-control mb-3" placeholder="Ваш email" required>
            <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
        </form>
    </div>
{% endblock %}
